name: Release

# Builds the Windows installers from a version tag and publishes them as a GitHub
# release with SHA-256 checksums.
#
# Rules this workflow follows:
#   * only runs on tags (a dispatch on a branch fails early instead of publishing
#     something untagged),
#   * the tag must match the version in package.json / tauri.conf.json /
#     src-tauri/Cargo.toml (tag "v1.4.1-bloodwing.1" -> base version "1.4.1"),
#   * assets are built from the tagged commit, never uploaded from a local machine,
#   * no signing keys or secrets are used: the in-app updater is intentionally
#     disabled in this fork, so no update artifacts are produced,
#   * `RELEASE-NOTES.md` is the release body — update it before tagging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Require a version tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow must run on a version tag such as v1.4.1-bloodwing.1."
            echo "::error::To publish: create and push the tag, or use Actions -> Release -> Run workflow and select the tag."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Verify tag matches manifest versions
        shell: bash
        run: |
          set -euo pipefail
          base="${GITHUB_REF_NAME#v}"   # v1.4.1-bloodwing.1 -> 1.4.1-bloodwing.1
          base="${base%%-*}"            # -> 1.4.1
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "tag base: ${base} | package.json: ${pkg} | tauri.conf.json: ${tauri} | Cargo.toml: ${cargo}"
          for v in "$pkg" "$tauri" "$cargo"; do
            if [ "$v" != "$base" ]; then
              echo "::error::Version mismatch: tag implies ${base} but a manifest says ${v}. Run 'bun run bump' and re-tag."
              exit 1
            fi
          done

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build application and installers
        run: bun run tauri build

      - name: Package release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $dist = "dist-release"
          New-Item -ItemType Directory -Force $dist | Out-Null

          $exe  = "src-tauri/target/release/BloodWing.exe"
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          $msi  = Get-ChildItem "src-tauri/target/release/bundle/msi"  -Filter *.msi | Select-Object -First 1
          if (-not (Test-Path $exe)) { throw "Application binary not found: $exe" }
          if (-not $nsis) { throw "NSIS installer not found in bundle/nsis" }
          if (-not $msi)  { throw "MSI not found in bundle/msi" }

          Copy-Item $nsis.FullName "$dist/BloodWing-Island-Setup-$version-x64.exe"
          Copy-Item $msi.FullName  "$dist/BloodWing-Island-$version-x64.msi"
          Compress-Archive -Path $exe -DestinationPath "$dist/BloodWing-Island-Portable-$version-x64.zip" -Force

          $lines = Get-ChildItem $dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}" -f $hash, $_.Name
          }
          Set-Content -Path "$dist/SHA256SUMS.txt" -Value $lines -Encoding ascii

          Get-ChildItem $dist -File | ForEach-Object { "{0}  ({1} bytes)" -f $_.Name, $_.Length }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --title "BloodWing Island $GITHUB_REF_NAME" \
            --notes-file RELEASE-NOTES.md \
            --verify-tag
