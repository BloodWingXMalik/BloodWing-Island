name: Bug report
description: Something in BloodWing Nectar isn't working the way it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more detail you give, the faster it can be fixed.

        Before filing, please skim the
        [Troubleshooting section](https://github.com/BloodWingXMalik/BloodWing-Nectar/blob/HEAD/README.md#troubleshooting)
        and search [existing issues](https://github.com/BloodWingXMalik/BloodWing-Nectar/issues)
        in case it is already reported.

        This project is a fork of [Nectar](https://github.com/kua8/Nectar). If the
        same bug also reproduces with upstream Nectar, please report it there too and
        link the two issues.

        **Never paste passwords, tokens or calendar credentials** — filtered logs and
        settings snippets are enough.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
      placeholder: "The notch stays collapsed when I hover it on my second monitor..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that trigger the problem, starting from a fresh launch if possible.
      placeholder: |
        1. Start BloodWing
        2. Move the mouse over the notch
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - Notch
        - Dock
        - Taskbar hiding / restoring
        - Settings window
        - Calendar / calendar sync
        - Media / visualizer
        - Timer / stopwatch
        - Weather / battery / status widgets
        - Performance (CPU, memory, battery)
        - Installer / uninstaller
        - Something else
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: BloodWing Nectar version
      description: "Shown in the tray menu or Settings → About — e.g. 1.4.1-bloodwing.1, or \"built from source (commit …)\"."
      placeholder: 1.4.1-bloodwing.1
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version and build
      description: "Run `winver`, e.g. Windows 11 Pro, build 26300."
      placeholder: Windows 11, build 26300
    validations:
      required: true

  - type: input
    id: monitors
    attributes:
      label: Monitor setup
      description: "Display count, resolution and scaling — e.g. 2 × 1920×1080 @ 100%."
      placeholder: 2 × 1920×1080 @ 100%
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and settings (optional)
      description: "Relevant recent lines from `%APPDATA%\\com.bloodwing.notch\\logs\\bloodwing.log`, plus any settings involved. Remove personal data (calendar URLs, names) first."
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and read the troubleshooting guide.
          required: true
        - label: This report contains no passwords, tokens or private data.
          required: true
