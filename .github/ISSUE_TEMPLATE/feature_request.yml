name: Feature request
description: Suggest an idea or improvement for BloodWing Nectar
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Please check
        [existing issues](https://github.com/BloodWingXMalik/BloodWing-Nectar/issues)
        first so we don't duplicate a request.

        This is a personal fork of [Nectar](https://github.com/kua8/Nectar) — changes
        to the shared core (notch, dock, media, multi-monitor) are usually better sent
        [upstream](https://github.com/kua8/Nectar/issues) as well, so every user
        benefits and the two projects stay close.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation or frustration behind the request, not just the solution.
      placeholder: "I often drag files between apps and have to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: How do you imagine it working? Sketches and screenshots are welcome.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of BloodWing Nectar?
      options:
        - Dock
        - Notch
        - Theme / appearance / motion
        - Calendar / calendar sync
        - Timer / stopwatch
        - Media / visualizer
        - Settings window
        - Installer / update experience
        - Something new
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other tools or workarounds, and why they don't fit.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this request.
          required: true
